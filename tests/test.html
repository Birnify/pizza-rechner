<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Pizzateig-Rechner: Tests</title>
<style>
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#faf6f0;color:#2b2420;margin:0;padding:24px;line-height:1.5;}
  h1{font-size:20px;}
  h2{font-size:15px;margin:24px 0 8px;color:#8a7f76;border-bottom:1px solid #ece3d8;padding-bottom:4px;}
  #summary{font-size:16px;font-weight:700;padding:10px 14px;border-radius:10px;margin:14px 0;display:inline-block;}
  #summary.ok{background:#e7f3e9;color:#2f6b38;}
  #summary.fail{background:#fdeceb;color:#a8341f;}
  .case{background:#fff;border:1px solid #ece3d8;border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .case h3{margin:0 0 6px;font-size:14px;}
  .assert{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;padding:2px 0;}
  .assert.pass::before{content:"✓ ";color:#2f6b38;}
  .assert.fail{color:#a8341f;font-weight:700;}
  .assert.fail::before{content:"✗ ";}
  #stubs{position:absolute;left:-9999px;top:-9999px;}
  /* Duplikat der Feature-Flag-"hints"-Regel aus css/styles.css (v3.17.0): test.html
     lädt bewusst kein echtes App-Stylesheet (reine Rechenlogik-Tests, eigenes minimales
     Test-Runner-CSS), daher hier 1:1 dieselbe Regel nur für den DOM-Effekt-Test unten. */
  body.hints-off .hint,
  body.hints-off .timersys-hint,
  body.hints-off .timerhint{display:none;}
</style>
</head>
<body>
<h1>🍕 Pizzateig-Rechner: Rechenlogik-Tests</h1>
<p>Per Doppelklick öffnen. Testet die echten Module gegen erwartete Werte: ohne Server, ohne Installation.</p>
<div id="summary">läuft…</div>
<div id="results"></div>

<div id="stubs">
  <span id="totalW"></span><span id="ballsOut"></span><span id="ballwOut"></span>
  <span id="gFlour"></span><span id="gWater"></span><span id="gSalt"></span>
  <span id="gYeast"></span><span id="yLabel"></span><span id="gOil"></span><div id="gOilRow"></div>
  <span id="gSugar"></span><div id="gSugarRow"></div>
  <span id="pFlour"></span><span id="pWater"></span><span id="pYeast"></span><span id="pyLabel"></span>
  <span id="mFlour"></span><span id="mWater"></span><span id="mSalt"></span><span id="mYeast"></span>
  <span id="mOil"></span><div id="mOilRow"></div>
  <span id="mSugar"></span><div id="mSugarRow"></div>
  <div id="mYeastRow"></div>
  <div id="guideSummary"></div><div id="guideSteps"></div>
  <div id="flourWarn"></div>
  <div id="guideAnnounce" role="status" aria-live="polite"></div>
  <div id="shoppingList"></div>
  <select id="flour"><option value="caputo_pizzeria" selected></option></select>
  <input type="text" id="timeISO">
  <div id="recipesCard"></div><div id="shareBlock"></div><div id="shoppingRow"></div>
  <select id="preset"><option value=""></option><option value="newyork_style"></option><option value="napoli_klassisch"></option><option value="teglia"></option></select>
  <!-- Eigener Wrapper um Zucker-Feld + Vorgänger-Feld + Live-Region (Backlog Punkt J,
       v4.12.0): hält die Geschwister-Traversierung von PZ.moveFocusBeforeHide() beim
       sugarBlock-Integrationstest von den unabhängigen fm*-Stubs weiter unten getrennt --
       sonst würde "nächstes sichtbares Geschwister" fälschlich über die Wrapper-Grenze
       hinweg bei den fm*-Stubs landen statt (wie im echten Markup) beim vorigen Feld
       innerhalb derselben Karte. -->
  <div id="sugarBlockCardStub">
    <div id="sugarBlockBefore"><button type="button" id="sugarBlockBeforeBtn">before-sugar</button></div>
    <div id="sugarBlock"><button type="button" id="sugarBlockFocusStub">Zucker-Test-Fokus</button></div>
    <div id="sugarBlockLiveMsg" role="status" aria-live="polite"></div>
  </div>
  <!-- Backlog Punkt J (v4.12.0, WCAG 2.4.3): Stub-Markup für PZ.moveFocusBeforeHide()/
       PZ.toggleCollapse() (js/dom.js), realistische Geschwister-Struktur nötig (die
       Helfer laufen echte DOM-Traversierung auf offsetParent-Sichtbarkeit, kein reiner
       State-Vergleich). Sichtbarkeit wird in den Tests selbst per style.display
       gesteuert -- tests/test.html lädt bewusst KEIN echtes App-Stylesheet, ".collapse"
       hat hier also keine CSS-Wirkung. -->
  <div id="fmBefore"><button type="button" id="fmBeforeBtn">before</button></div>
  <div id="fmA"><button type="button" id="fmBtnA">in A</button></div>
  <div id="fmB"><button type="button" id="fmBtnB">in B</button></div>
  <div id="fmAfter"><button type="button" id="fmAfterBtn">after</button></div>
  <div id="tcContainer"><button type="button" id="tcBtn">tc</button></div>
  <div id="tcLiveMsg" role="status" aria-live="polite"></div>
  <div class="card" id="fmFallbackWrap"><div id="fmFallbackContainer"><button type="button" id="fmFallbackBtn">fallback-container</button></div></div>
  <button type="button" id="fmExternalFallback">external-fallback</button>
  <div class="hint" id="testHintStub">Erklärender Beispiel-Hinweistext</div>
  <button type="button" id="testDescribedBtn" aria-describedby="testHintStub">Beispiel-Button</button>
  <div class="seg" id="themeSwitch">
    <button type="button" data-theme-choice="light">Hell</button>
    <button type="button" data-theme-choice="dark">Dunkel</button>
  </div>
  <div id="themeAnnounce" role="status" aria-live="polite"></div>
  <div class="seg" id="unitSwitch">
    <button type="button" data-units-choice="metric">Metrisch</button>
    <button type="button" data-units-choice="imperial">Imperial</button>
  </div>
  <div id="unitsAnnounce" role="status" aria-live="polite"></div>
  <div id="wasteNote"></div>
  <!-- Sektion 41 (v4.36.0, Glossar-Kachelregal): js/glossary.js wird ab hier tatsächlich
       geladen (bis v4.35.2 bewusst ausgeschlossen, s. Kommentar oben bei den
       Modul-<script>-Tags) -- die drei Ansichten (Regal/Kategorie/Suche) sind reine
       DOM-Logik ohne PZ.state-Bezug, brauchen aber echte Stub-Elemente, weil das Modul
       beim Laden sofort rendert (renderShelf() beim ersten render()-Aufruf). Bewusst VOR
       dem fmPrevOnly-Paar unten eingefügt (nicht dahinter) -- das Paar muss laut eigenem
       Kommentar die LETZTEN Kinder von #stubs bleiben. -->
  <input type="text" id="glossarySearch">
  <div id="glossarySearchLiveMsg" role="status" aria-live="polite"></div>
  <div id="glossaryList"></div>
  <!-- fmPrevOnly-Paar bewusst als LETZTE Kinder von #stubs (kein nachfolgendes
       Geschwister im DOM) -- testet den "kein sichtbarer Nachfolger -> voriges
       Geschwister"-Zweig von PZ.moveFocusBeforeHide(). -->
  <div id="fmPrevOnlyBefore"><button type="button" id="fmPrevOnlyBeforeBtn">before-only</button></div>
  <div id="fmPrevOnly"><button type="button" id="fmPrevOnlyBtn">prevonly</button></div>
  <!-- Sektion 32 (v4.24.0): eigener PZ.makePrefStages()-Stub, unabhängig von den echten
       #prefStage/#prefStageVal-Elementen (ui.js ist hier nicht geladen, s. Kommentar
       oben bei PZ.set) -- testet die rel:'pref'-Umrechnung + den Vorteig-Anteil-Drift-Fix
       auf derselben Ebene, auf der js/ui.js und js/newrecipe.js sie auch nutzen. -->
  <div id="testPrefStage"></div><span id="testPrefStageVal"></span>
</div>

<script src="../js/store.js"></script>
<script src="../js/dom.js"></script>
<script src="../js/state.js"></script>

<script src="../js/i18n.js"></script>
<script src="../js/images.js"></script>

<script src="../js/units.js"></script>
<script src="../js/widgets.js"></script>
<script src="../js/flour.js"></script>
<script src="../js/schedule.js"></script>
<script src="../js/guide.js"></script>
<script src="../js/calc.js"></script>
<script src="../js/print.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/backup.js"></script>
<script src="../js/share.js"></script>
<script src="../js/party.js"></script>
<script src="../js/glossary.js"></script>

<script>
"use strict";
(async function () {
  const results = document.getElementById('results');
  let passed = 0, failed = 0;

  // --- Sprachversion (js/i18n.js, v3.28.0): Determinismus erzwingen -----------------
  // Die gesamte restliche Testsuite prüft deutsche Textausgaben 1:1 als String-Literale
  // (z. B. "Kneten", "Stockgare", "Rezept 1", "Tipp: "). PZ.t() liefert je nach aktiver
  // Sprache unterschiedlichen Text: ohne diesen Fix würde die automatische
  // Spracherkennung (navigator.language des Test-Browsers) oder ein alter, im selben
  // Browser-Profil liegender "pizzaLang"-Wert aus einem echten Nutzungslauf hier
  // durchschlagen und praktisch alle Textvergleiche unten zum Flackern bringen. Deshalb
  // hier VOR jedem Testlauf explizit auf Deutsch fixieren, unabhängig vom Browser/Profil.
  try { PZ.store.remove('pizzaLang'); } catch (e) { /* ignore */ }
  if (PZ.setLang) PZ.setLang('de');

  // --- Einheitensystem (js/units.js, v3.65.0): identischer Determinismus-Fix wie bei
  // der Sprache direkt darüber -- ohne diesen Fix würde eine automatische Erkennung
  // "en-US" (Test-Browser-Region) alle bestehenden, in Gramm/Celsius formulierten
  // Zahlenvergleiche unten zum Flackern bringen (Ergebnis-Panel/Anleitung zeigen dann
  // oz/lb/°F statt g/°C). Deshalb hier VOR jedem Testlauf explizit auf Metrisch fixieren.
  try { PZ.store.remove('pizzaUnits'); } catch (e) { /* ignore */ }
  if (PZ.setUnitSystem) PZ.setUnitSystem('metric');

  // Basis-Zustand für alle Tests
  const BASE = {
    balls: 4, ballw: 250, hyd: 62, salt: 2.8, oil: 0, sugar: 0,
    method: 'direct', pref: 70, bhyd: 45, prefMature: 24, prefStage: 'b_klassisch',
    yeastType: 'fresh', yeast: 0.30,
    ddt: 24, room: 21, flourTemp: 21, knead: '3',
    timeMode: 'start', timeISO: '',
    flour: 'caputo_pizzeria',
    coldStage: 'balls',
    // v4.28.0: explizit null, sonst würde Object.assign(PZ.state, BASE, overrides) einen
    // von einem FRÜHEREN Testfall (z. B. Sektion "scheduleOverride") gesetzten Wert
    // stehen lassen, weil Object.assign nur vorhandene Schlüssel überschreibt, keine
    // fehlenden löscht -- BASE ist der etablierte Reset-Anker für jeden Testfall.
    scheduleOverride: null
  };

  function round(x) { return typeof x === 'number' ? Math.round(x * 1000) / 1000 : x; }

  // Stellt sicher dass die Option im Select existiert (für Mehl-Tests)
  function setFlour(key) {
    const sel = document.getElementById('flour');
    if (!sel.querySelector('option[value="' + key + '"]')) {
      const o = document.createElement('option');
      o.value = key;
      sel.appendChild(o);
    }
    sel.value = key;
  }

  // --- Stubs für js/storage.js: ui.js ist hier nicht geladen (kein DOM-Markup
  // für Slider/Segmente), storage.js ruft aber PZ.set/selectSeg/applyMethod/
  // updateTimeLabel auf. Diese Stubs übernehmen nur die state-Zuweisung, ohne
  // echtes UI zu berühren: die Rechenlogik-Module bleiben unverändert getestet.
  PZ.set = new Proxy({}, { get: () => (val) => { /* no-op, state wird von storage.js direkt per Object.assign gesetzt */ } });
  PZ.selectSeg = function () {};
  PZ.applyMethod = function () {};
  PZ.updateTimeLabel = function () {};

  // --- Feature-Flags (js/settings.js): Baseline für die gesamte restliche Testsuite ---
  // Alle bestehenden Tests unten sind so geschrieben, als wären sämtliche Zusatzfunktionen
  // aktiv (Stand vor Einführung der Feature-Flags in dieser Version): sonst würde z. B.
  // der Default "freezeHint: false" den bestehenden Einfrier-Hinweis-Test brechen. Deshalb
  // hier explizit auf "alles an" setzen; die eigentliche Flag-Logik (Defaults, Persistenz,
  // Render-Effekt der einzelnen Flags) wird weiter unten in einer eigenen Sektion geprüft,
  // die einzelne Flags gezielt aus- und wieder auf diese Baseline zurückschaltet.
  Object.assign(PZ.FLAGS, {
    timer: true, timerSystem: true, hints: true
  });

  // --- Globale Hefemengen-/Verschwendungs-Anpassung (js/settings.js, v3.64.0) ---
  // Baseline für die gesamte restliche Testsuite: beide Werte auf 0 -- sonst würde
  // allein der reale Default (wasteAdjust: 2) alle bestehenden Masseerhaltungs-Tests
  // brechen (total wäre nicht mehr exakt N*W). Die eigentliche Adjust-Logik (Defaults,
  // Klemmen, Persistenz, Rechenwirkung) wird in einer eigenen Sektion geprüft, die
  // gezielt von dieser Baseline abweicht und sie danach wiederherstellt.
  PZ.ADJUST = { yeastAdjust: 0, wasteAdjust: 0 };

  // Gerenderte Zahlenanzeigen (z. B. #mOil/#mSugar) nutzen seit je her (js/widgets.js) bzw.
  // seit v4.30.1 (js/units.js) hart Komma statt Punkt als Dezimaltrennzeichen -- parseFloat()
  // liest an einem Komma vorzeitig ab (parseFloat("11,76") -> 11). Dieser Helfer liest den
  // DOM-Text stattdessen korrekt (Komma -> Punkt vor dem Parsen).
  function parseDeFloat(str) { return parseFloat(String(str).replace(',', '.')); }
  // Gegenstück: erwarteten Anzeigetext mit deutschem Komma statt Punkt bilden (js/units.js/
  // js/widgets.js normieren seit je her bzw. seit v4.30.1 hart auf Komma).
  function deFixed(num, decimals) { return num.toFixed(decimals).replace('.', ','); }

  // --- Haupt-Testfall: setzt state, rechnet, prüft R-Werte ---
  function testCase(name, overrides, buildChecks) {
    const state = Object.assign({}, BASE, overrides);
    Object.assign(PZ.state, state);
    if (state.flour) setFlour(state.flour);
    PZ.calc();
    const checks = buildChecks(PZ.R);
    renderBox(name, checks.map(([label, actual, expected, tol]) => {
      const ok = (tol == null) ? actual === expected : Math.abs(actual - expected) <= tol;
      return { label, actual, expected, tol, ok };
    }));
  }

  // --- Schedule-Testfall: setzt state, ruft PZ.schedule(), prüft Felder ---
  // Für string-expected: prüft ob actual den string enthält (Label-Checks).
  // Für number-expected mit tol: Absolutdifferenz ≤ tol.
  // Für boolean/exact: ===
  function testScheduleCase(name, overrides, buildChecks) {
    Object.assign(PZ.state, BASE, overrides);
    const f = PZ.schedule();
    const checks = buildChecks(f);
    renderBox(name, checks.map(([label, actual, expected, tol]) => {
      let ok;
      if (typeof expected === 'string') {
        ok = String(actual).includes(expected);
      } else if (tol == null) {
        ok = actual === expected;
      } else {
        ok = Math.abs(actual - expected) <= tol;
      }
      return { label, actual, expected, tol, ok };
    }));
  }

  // --- Mehl-Warn-Testfall: prüft innerHTML von #flourWarn ---
  function testFlourWarn(name, overrides, buildChecks) {
    const state = Object.assign({}, BASE, overrides);
    Object.assign(PZ.state, state);
    if (state.flour) setFlour(state.flour);
    PZ.calc();
    const html = (document.getElementById('flourWarn') || {}).innerHTML || '';
    const checks = buildChecks(html);
    renderBox(name, checks.map(([label, ok]) => ({ label, ok, actual: ok ? 'ja' : 'nein', expected: 'ja', tol: null })));
  }

  // --- Sprachtest: wie testCase, aber mit Sprach-Umschaltung ---
  function testCaseWithLang(name, lang, overrides, buildChecks) {
    const savedLang = PZ.getLang();  // aktuelle Sprache merken
    try {
      PZ.setLang(lang);  // Sprache wechseln
      const state = Object.assign({}, BASE, overrides);
      Object.assign(PZ.state, state);
      if (state.flour) setFlour(state.flour);
      PZ.calc();
      const checks = buildChecks(PZ.R);
      renderBox(name, checks.map(([label, actual, expected, tol]) => {
        const ok = (tol == null) ? actual === expected : Math.abs(actual - expected) <= tol;
        return { label, actual, expected, tol, ok };
      }));
    } finally {
      PZ.setLang(savedLang);  // Sprache zurückstellen
    }
  }

  function renderBox(name, checks) {
    const box = document.createElement('div');
    box.className = 'case';
    const h = document.createElement('h3');
    h.textContent = name;
    box.appendChild(h);
    checks.forEach(({ label, actual, expected, tol, ok }) => {
      const line = document.createElement('div');
      line.className = 'assert ' + (ok ? 'pass' : 'fail');
      line.textContent = ok
        ? label + ' = ' + round(actual)
        : label + ': erwartet ' + JSON.stringify(expected) + (tol != null ? ' ±' + tol : '') + ', war ' + JSON.stringify(round(actual));
      box.appendChild(line);
      ok ? passed++ : failed++;
    });
    results.appendChild(box);
  }

  function heading(text) {
    const h = document.createElement('h2');
    h.textContent = text;
    results.appendChild(h);
  }

  // ─────────────────────────────────────────────────────────────
  heading('1 · Bäckerprozente');

  testCase('Direkt · Standard (4×250 g, 62 % Hyd, 2,8 % Salz, 0,30 % Hefe frisch)', {}, R => {
    // flour = 1000 / (1 + 0.62 + 0.028 + 0.003) = 1000 / 1.651 = 605.69
    return [
      ['total', R.total, 1000, 0],
      ['flour', R.flour, 605.69, 0.05],
      ['water', R.water, 375.53, 0.05],
      ['salt',  R.salt,  16.96,  0.05],
      ['yeast', R.yeast, 1.817,  0.01],
    ];
  });

  testCase('Direkt · Skalierung 6×280 g, 65 % Hyd, 0,3 % Hefe', {
    balls: 6, ballw: 280, hyd: 65, yeast: 0.3
  }, R => {
    // total = 1680; flour = 1680 / (1 + 0.65 + 0.028 + 0.003) = 1680 / 1.681 = 999.4
    const expFlour = 1680 / (1 + 0.65 + 0.028 + 0.003);
    return [
      ['total', R.total, 1680, 0],
      ['flour', R.flour, expFlour, 0.1],
      ['water', R.water, expFlour * 0.65, 0.1],
      ['salt',  R.salt,  expFlour * 0.028, 0.05],
    ];
  });

  // ─────────────────────────────────────────────────────────────
  heading('2 · Wassertemperatur & Eismenge (DDT-Methode)');

  testCase('DDT · Hand, Normalraum (room 21, ddt 24)', { room: 21, flourTemp: 21, ddt: 24, knead: '3' }, R => [
    // wT = 24*3 - 21 - 21 - 3 = 27
    ['wT', R.wT, 27, 0],
    ['ice', R.ice, 0, 0],
  ]);

  testCase('DDT · Maschine, Normalraum (room 21, ddt 24)', { room: 21, flourTemp: 21, ddt: 24, knead: '6' }, R => [
    // wT = 24*3 - 21 - 21 - 6 = 24
    ['wT', R.wT, 24, 0],
    ['ice', R.ice, 0, 0],
  ]);

  testCase('DDT · Hand, warmer Raum (room 25, ddt 24)', { room: 25, flourTemp: 25, ddt: 24, knead: '3' }, R => [
    // wT = 24*3 - 25 - 25 - 3 = 19: kälter als Ttap (25°), also wird Eis gebraucht (nicht 0!)
    // x = 375.53*4.18*(25-19) / (334 + 4.18*19 + 4.18*6) ≈ 21 g
    ['wT', R.wT, 19, 0],
    ['ice', R.ice, 21, 2],
  ]);

  testCase('Eiswasser · Maschine, Sommer (room 28, ddt 22)', { room: 28, flourTemp: 28, ddt: 22, knead: '6' }, R => [
    // wT = 22*3 - 28 - 28 - 6 = 4
    // ice ≈ 375.53 * 4.18 * (28-4) / (334 + 4.18*4 + 4.18*(28-4)) ≈ 84 g
    ['wT', R.wT, 4, 0],
    ['ice', R.ice, 84, 2],
  ]);

  testCase('Eiswasser · Maschine, Extremsommer (room 32, ddt 23)', { room: 32, flourTemp: 32, ddt: 23, knead: '6' }, R => {
    // wT = 23*3 - 32 - 32 - 6 = -1
    // M = water = flour*0.62; x = M*c*(32-(-1)) / (334 + c*(-1) + c*(32-(-1)))
    //   = M*4.18*33 / (334 - 4.18 + 137.94) = M*137.94/467.76 = M*0.2948
    // flour = 1000/1.651 = 605.69; water = 375.53
    // ice ≈ 375.53 * 0.2948 ≈ 111 g
    return [
      ['wT', R.wT, -1, 0],
      ['ice', R.ice, 111, 5],
    ];
  });

  testCase('Kein Eis wenn Leitungswasser kälter als wT', { room: 15, flourTemp: 15, ddt: 23, knead: '3' }, R => [
    // wT = 23*3 - 15 - 15 - 3 = 36 > 15 → kein Eis, Wasser anwärmen
    ['wT', R.wT, 36, 0],
    ['ice', R.ice, 0, 0],
  ]);

  // --- Mehltemperatur getrennt von Raumtemperatur (v3.20.0) ---
  // wT = ddt*3 - room - flourTemp - friction (vorher: room doppelt statt eigenem flourTemp).
  testCase('DDT · Mehl kühler als Raum (Keller/Kühlschrank)', { room: 21, flourTemp: 8, ddt: 24, knead: '3' }, R => [
    // wT = 24*3 - 21 - 8 - 3 = 40
    ['wT', R.wT, 40, 0],
  ]);

  testCase('DDT · Mehl wärmer als Raum', { room: 18, flourTemp: 26, ddt: 24, knead: '3' }, R => [
    // wT = 24*3 - 18 - 26 - 3 = 25
    ['wT', R.wT, 25, 0],
  ]);

  testCase('DDT · Default-Regression: flourTemp startet wie room (unverändertes Verhalten)', { room: 25, flourTemp: 25, ddt: 24, knead: '3' }, R => [
    // identisch zum alten "Mehl- und Raumtemp gleich"-Verhalten, solange flourTemp == room
    ['wT', R.wT, 19, 0],
  ]);

  // --- Kombinationsfälle: flourTemp treibt den Eisbedarf unabhängig vom Raum ---
  testCase('DDT · Eiswasser-Extremfall: warmes Mehl allein treibt den Eisbedarf (Raum moderat)', {
    room: 22, flourTemp: 35, ddt: 24, knead: '6'
  }, R => [
    // wT = 24*3 - 22 - 35 - 6 = 9: obwohl der Raum mit 22° gar nicht extrem ist, macht allein
    // das warme Mehl (35°) einen spürbaren Eisbedarf nötig (Maschinenknetung, Reibung 6).
    ['wT', R.wT, 9, 0],
    ['ice', R.ice, 48, 3],
  ]);

  testCase('DDT · Kaltes Mehl vermeidet Eisbedarf trotz warmem Raum', {
    room: 30, flourTemp: 5, ddt: 24, knead: '3'
  }, R => [
    // wT = 24*3 - 30 - 5 - 3 = 34 > Ttap(30)+1 → "anwärmen"-Zweig, kein Eis nötig: das kalte
    // Mehl (5°, z.B. aus dem Kühlschrank) überkompensiert den warmen Raum vollständig.
    ['wT', R.wT, 34, 0],
    ['ice', R.ice, 0, 0],
  ]);

  // --- Masseerhaltung: flourTemp beeinflusst NUR wT/Eis, nie die Bäckerprozent-Mengen ---
  (function () {

  // fmtClock-Nachbau (aus js/guide.js): nur zum Prüfen des gerenderten Anleitungstexts,

  function fmtClockTest(d) {
    const wd = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()];
    const p = n => String(n).padStart(2, '0');
    return `${wd} ${p(d.getDate())}.${p(d.getMonth() + 1)}. · ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

    withCleanStorage(() => {

      const savedId = PZ.getActiveId();
      Object.assign(PZ.state, { sugar: 0 }); // simuliert einen veralteten Regler-Stand vor dem Laden

    }

    // --- exportRecipes(): liefert ALLE gespeicherten Rezepte, nicht nur den aktiven state ---

  // Anleitung direkt aus dem DOM (#guideSummary/#flourWarn/#guideSteps) und baut daraus
  // von Hand ein PDF-1.4-Dokument (kein Font-Embedding, keine externe Bibliothek: s.
  // Kommentar in js/pdf.js). Getestet wird die reine Datenfunktion, kein window.print()-
  // artiger Seiteneffekt (analog zu buildShoppingList() in Sektion 15: printGuide()/
  // printShoppingList() selbst werden aus demselben Grund auch dort nicht unit-getestet).

  // Dekodiert ein Uint8Array 1:1 zurück in einen JS-String (jedes Byte = ein Zeichen:
  // exakt der Weg, auf dem buildGuidePdfBytes() den PDF-Bytestring erzeugt hat).
  function bytesToStr(bytes) {
    let out = '';
    for (let i = 0; i < bytes.length; i++) out += String.fromCharCode(bytes[i]);
    return out;
  }
  // Nur Codepoints <= 0xFF sind WinAnsi-/Latin-1-tauglich: Voraussetzung dafür, dass
  // sanitizeText() wirklich jeden Textblock von Emoji/Symbolen ohne WinAnsi-Entsprechung
  // befreit hat (sonst würde ein Font ohne Embedding die Zeichen nicht darstellen können).
  function allLatin1(str) {
    for (const ch of str) { if (ch.codePointAt(0) > 0xFF) return false; }
    return true;
  }

  // Regressions-Anker: alle sichtbaren Zutaten aus buildShoppingList() im Array
  testCase('Einkaufslisten-PDF: Regressions-Anker — alle Zutaten aus buildShoppingList() im collectShoppingListContent()-Array', {
    oil: 2.5, sugar: 1, balls: 6, hyd: 62
  }, R => {
    // buildShoppingList() wird von collectShoppingListContent() aufgerufen
    const blocks = PZ._pdfCollectShoppingListContent();
    const bodyTexts = blocks.filter(b => b.type === 'body').map(b => b.text).join('|');

    // Alle Zutaten sollten im bodyTexts enthalten sein (je nach Schwellwerten)
    const hasFlour = bodyTexts.includes('Mehl');
    const hasWater = bodyTexts.includes('Wasser');
    const hasOil = R.oil >= 0.05 ? bodyTexts.includes('Olivenöl') : !bodyTexts.includes('Olivenöl');
    const hasSugar = R.sugar >= 0.05 ? bodyTexts.includes('Zucker') : !bodyTexts.includes('Zucker');
    const hasSalt = R.salt > 0 ? bodyTexts.includes('Salz') : true; // Salz ist Schwellwert im Preset

    return [
      ['Mehl-Zeile enthalten', hasFlour, true],
      ['Wasser-Zeile enthalten', hasWater, true],
      ['Öl-Zeile sichtbar/unsichtbar korrekt (2.5 % = sichtbar)', hasOil, true],
      ['Zucker-Zeile sichtbar/unsichtbar korrekt (1 % = sichtbar)', hasSugar, true],
      ['Salz-Verhalten korrekt', hasSalt, true],
      ['Alle body-Blöcke WinAnsi-tauglich', blocks.filter(b => b.type === 'body').every(b => allLatin1(b.text)), true],
    ];
  });

    return [

      ['Keine warn-Blöcke enthalten', !blocks.some(b => b.type === 'warn'), true],
      ['Keine tip-Blöcke enthalten', !blocks.some(b => b.type === 'tip'), true],
      ['Ungültige Blöcke (falls vorhanden)', invalidBlocks.length === 0 ? 'keine' : invalidBlocks.map(b => b.type).join(','), 'keine'],

  // ─────────────────────────────────────────────────────────────
  heading('22 · Pizza-Party-Planer (js/party.js)');

  // Reine Datenfunktionen getestet (js/party.js hat keine UI-Markup-Elemente in
  // dieser Testseite -> die UI-Verdrahtung im Modul läuft nach dem frühen
  // "return" gar nicht erst an, s. Kommentar in js/party.js). Eigener
  // localStorage-Key ("pizzaPartyPlanner"), komplett getrennt vom
  // Rezepte-Key ("pizzaRechner"): analog zum withCleanStorage()-Muster aus
  // Sektion 16/20, aber mit eigenem Key, damit echte Nutzerdaten in beiden
  // Keys unangetastet bleiben.
  (function () {
    const PARTY_KEY = 'pizzaPartyPlanner';
    const backup = PZ.store.get(PARTY_KEY);

    function withCleanPartyStorage(fn) {
      PZ.store.remove(PARTY_KEY);
      try { fn(); } finally { PZ.store.remove(PARTY_KEY); }
    }

    // --- getAllPizzas(): 8 vorgegebene Beispielpizzen, keine eigenen ohne Anlegen ---
    withCleanPartyStorage(() => {
      const pizzas = PZ.partyGetAllPizzas();
      renderBox('getAllPizzas() liefert die 8 vorgegebenen Beispielpizzen (leere Bibliothek)', [
        { label: 'Genau 8 Pizzen', ok: pizzas.length === 8, actual: pizzas.length, expected: 8, tol: null },
        { label: 'Alle als custom:false markiert', ok: pizzas.every(p => p.custom === false), actual: pizzas.map(p => p.custom), expected: 'alle false', tol: null },
        { label: '"Margherita" ist enthalten', ok: pizzas.some(p => p.name === 'Margherita'), actual: pizzas.map(p => p.name), expected: 'enthält Margherita', tol: null },
        { label: 'Jede Pizza hat mindestens eine Zutat', ok: pizzas.every(p => p.ingredients.length > 0), actual: pizzas.map(p => p.ingredients.length), expected: 'alle > 0', tol: null }
      ]);
    });

    // --- addCustomPizza(): gültige Eingabe legt eine neue, als custom markierte Pizza an ---
    withCleanPartyStorage(() => {
      const pizza = PZ.partyAddCustomPizza('Peperoni-Spezial', [
        { name: 'Peperoni', amount: 30, unit: 'g' },
        { name: 'Mozzarella', amount: 90, unit: 'g' }
      ]);
      const all = PZ.partyGetAllPizzas();
      renderBox('addCustomPizza() legt eine neue eigene Pizza an', [
        { label: 'Rückgabe ist die neue Pizza (Name korrekt)', ok: !!pizza && pizza.name === 'Peperoni-Spezial', actual: pizza && pizza.name, expected: 'Peperoni-Spezial', tol: null },
        { label: 'Pizza bekommt eine id', ok: !!pizza && typeof pizza.id === 'string' && pizza.id.length > 0, actual: pizza && pizza.id, expected: 'String', tol: null },
        { label: 'Jetzt 9 Pizzen insgesamt (8 Presets + 1 eigene)', ok: all.length === 9, actual: all.length, expected: 9, tol: null },
        { label: 'Neue Pizza ist als custom:true markiert', ok: all.find(p => p.id === pizza.id).custom === true, actual: all.find(p => p.id === pizza.id).custom, expected: true, tol: null }
      ]);
    });

    // --- addCustomPizza(): leere/ungültige Zutatenzeilen werden gefiltert, nicht übernommen ---
    withCleanPartyStorage(() => {
      const pizza = PZ.partyAddCustomPizza('Testpizza', [
        { name: 'Ananas', amount: 25, unit: 'g' },
        { name: '', amount: 10, unit: 'g' },       // kein Name -> verworfen
        { name: 'Ohne Menge', amount: 0, unit: 'g' }, // Menge 0 -> verworfen
        { name: '  ', amount: 5, unit: 'g' }        // nur Leerzeichen -> verworfen
      ]);
      renderBox('addCustomPizza() filtert Zutatenzeilen ohne Namen oder mit Menge <= 0', [
        { label: 'Pizza wurde trotzdem angelegt (1 gültige Zutat reicht)', ok: !!pizza, actual: !!pizza, expected: true, tol: null },
        { label: 'Nur die 1 gültige Zutat übernommen', ok: pizza.ingredients.length === 1, actual: pizza.ingredients.length, expected: 1, tol: null },
        { label: 'Übernommene Zutat ist "Ananas"', ok: pizza.ingredients[0].name === 'Ananas', actual: pizza.ingredients[0].name, expected: 'Ananas', tol: null }
      ]);
    });

    // --- addCustomPizza(): komplett ungültige Eingabe (kein Name / keine gültige Zutat) -> null ---
    withCleanPartyStorage(() => {
      const noName = PZ.partyAddCustomPizza('', [{ name: 'Salami', amount: 40, unit: 'g' }]);
      const noValidIng = PZ.partyAddCustomPizza('Leere Pizza', [{ name: '', amount: 0, unit: 'g' }]);
      const onlyWhitespaceName = PZ.partyAddCustomPizza('   ', [{ name: 'Salami', amount: 40, unit: 'g' }]);
      const all = PZ.partyGetAllPizzas();
      renderBox('addCustomPizza() liefert null bei fehlendem Namen oder ohne gültige Zutat: legt nichts an', [
        { label: 'Ohne Namen -> null', ok: noName === null, actual: noName, expected: null, tol: null },
        { label: 'Ohne gültige Zutat -> null', ok: noValidIng === null, actual: noValidIng, expected: null, tol: null },
        { label: 'Nur-Leerzeichen-Name -> null', ok: onlyWhitespaceName === null, actual: onlyWhitespaceName, expected: null, tol: null },
        { label: 'Keine der 3 Fehlversuche legt eine Pizza an (weiterhin nur 8 Presets)', ok: all.length === 8, actual: all.length, expected: 8, tol: null }
      ]);
    });

    // --- deleteCustomPizza(): entfernt Pizza UND eine ggf. gesetzte Stückzahl ---
    withCleanPartyStorage(() => {
      const pizza = PZ.partyAddCustomPizza('Zu löschen', [{ name: 'Testzutat', amount: 10, unit: 'g' }]);
      PZ.partySetQty(pizza.id, 3);
      PZ.partyDeleteCustomPizza(pizza.id);
      const all = PZ.partyGetAllPizzas();
      renderBox('deleteCustomPizza() entfernt die Pizza und ihre Stückzahl', [
        { label: 'Wieder nur 8 Pizzen (Presets)', ok: all.length === 8, actual: all.length, expected: 8, tol: null },
        { label: 'Gelöschte Pizza taucht nicht mehr auf', ok: !all.some(p => p.id === pizza.id), actual: all.map(p => p.id), expected: 'ohne gelöschte id', tol: null },
        { label: 'Stückzahl ist mit weg (getQty liefert 0)', ok: PZ.partyGetQty(pizza.id) === 0, actual: PZ.partyGetQty(pizza.id), expected: 0, tol: null }
      ]);
    });

    // --- setQty()/getQty(): klemmt auf 0–50, 0 entfernt den Eintrag wieder ---
    withCleanPartyStorage(() => {
      const r1 = PZ.partySetQty('preset_margherita', 5);
      const r2 = PZ.partySetQty('preset_margherita', 999); // über dem Maximum
      const r3 = PZ.partySetQty('preset_margherita', -3);  // unter dem Minimum
      const r4 = PZ.partySetQty('preset_margherita', 0);   // zurück auf 0
      renderBox('setQty() klemmt auf 0–50 (ganzzahlig), 0 setzt effektiv zurück', [
        { label: 'setQty(5) liefert 5', ok: r1 === 5, actual: r1, expected: 5, tol: null },
        { label: 'setQty(999) klemmt auf 50', ok: r2 === 50, actual: r2, expected: 50, tol: null },
        { label: 'setQty(-3) klemmt auf 0', ok: r3 === 0, actual: r3, expected: 0, tol: null },
        { label: 'setQty(0) liefert 0, getQty() danach ebenfalls 0', ok: r4 === 0 && PZ.partyGetQty('preset_margherita') === 0, actual: [r4, PZ.partyGetQty('preset_margherita')], expected: '[0, 0]', tol: null }
      ]);
    });

    // --- computeAggregatedList(): Kernrechnung: Mengen × Stückzahl, dedupliziert nach Name+Einheit ---
    withCleanPartyStorage(() => {
      PZ.partySetQty('preset_margherita', 3); // 3× 100g Mozzarella, 80g Tomatensauce, 3 Blätter Basilikum
      PZ.partySetQty('preset_salami', 2);     // 2× 90g Mozzarella, 80g Tomatensauce, 40g Salami
      const result = PZ.partyComputeAggregatedList();
      const byName = name => result.ingredients.find(i => i.name === name);
      renderBox('computeAggregatedList(): 3× Margherita + 2× Salami, aggregiert & dedupliziert', [
        { label: 'totalPizzaCount = 5', ok: result.totalPizzaCount === 5, actual: result.totalPizzaCount, expected: 5, tol: null },
        { label: '4 unterschiedliche Zutaten (Tomatensauce, Mozzarella, Basilikum, Salami)', ok: result.ingredients.length === 4, actual: result.ingredients.map(i => i.name), expected: 4, tol: null },
        { label: 'Mozzarella dedupliziert: 3×100 + 2×90 = 480 g', ok: byName('Mozzarella').amount === 480, actual: byName('Mozzarella').amount, expected: 480, tol: null },
        { label: 'Tomatensauce dedupliziert: 3×80 + 2×80 = 400 g', ok: byName('Tomatensauce').amount === 400, actual: byName('Tomatensauce').amount, expected: 400, tol: null },
        { label: 'Salami (nur bei einer Pizza): 2×40 = 80 g', ok: byName('Salami').amount === 80, actual: byName('Salami').amount, expected: 80, tol: null },
        { label: 'Basilikum behält seine eigene Einheit ("Blätter")', ok: byName('Basilikum').unit === 'Blätter', actual: byName('Basilikum').unit, expected: 'Blätter', tol: null }
      ]);
    });

    // --- computeAggregatedList(): Pizzen mit Stückzahl 0 fließen nicht ein ---
    withCleanPartyStorage(() => {
      PZ.partySetQty('preset_margherita', 2);
      PZ.partySetQty('preset_hawaii', 0); // explizit auf 0 gesetzt -> zählt nicht
      const result = PZ.partyComputeAggregatedList();
      renderBox('computeAggregatedList() ignoriert Pizzen mit Stückzahl 0', [
        { label: 'totalPizzaCount = 2 (nur Margherita)', ok: result.totalPizzaCount === 2, actual: result.totalPizzaCount, expected: 2, tol: null },
        { label: 'Kein "Ananas" in der Liste (Hawaii-Zutat, Stückzahl 0)', ok: !result.ingredients.some(i => i.name === 'Ananas'), actual: result.ingredients.map(i => i.name), expected: 'ohne Ananas', tol: null }
      ]);
    });

    // --- computeAggregatedList(): keine Auswahl -> leere, aber gültige Struktur ---
    withCleanPartyStorage(() => {
      const result = PZ.partyComputeAggregatedList();
      renderBox('computeAggregatedList() ohne jede Auswahl liefert eine leere, gültige Struktur', [
        { label: 'totalPizzaCount = 0', ok: result.totalPizzaCount === 0, actual: result.totalPizzaCount, expected: 0, tol: null },
        { label: 'ingredients ist ein leeres Array (kein Fehler)', ok: Array.isArray(result.ingredients) && result.ingredients.length === 0, actual: result.ingredients, expected: '[]', tol: null }
      ]);
    });

    // --- Eigene Pizzen fließen genauso in die Aggregation ein wie Presets ---
    withCleanPartyStorage(() => {
      const pizza = PZ.partyAddCustomPizza('Eigene Kreation', [{ name: 'Trüffelöl', amount: 10, unit: 'g' }]);
      PZ.partySetQty(pizza.id, 4);
      const result = PZ.partyComputeAggregatedList();
      const truffle = result.ingredients.find(i => i.name === 'Trüffelöl');
      renderBox('Eigene Pizzen fließen in computeAggregatedList() genauso ein wie Presets', [
        { label: 'totalPizzaCount = 4', ok: result.totalPizzaCount === 4, actual: result.totalPizzaCount, expected: 4, tol: null },
        { label: 'Trüffelöl: 4×10 = 40 g', ok: !!truffle && truffle.amount === 40, actual: truffle && truffle.amount, expected: 40, tol: null }
      ]);
    });

    // --- partyResetAllQuantities() (v3.30.0): alle Stückzahlen auf 0, Pizzen bleiben ---
    withCleanPartyStorage(() => {
      const pizza = PZ.partyAddCustomPizza('Bleibt erhalten', [{ name: 'Y', amount: 5, unit: 'g' }]);
      PZ.partySetQty('preset_margherita', 3);
      PZ.partySetQty('preset_salami', 2);
      PZ.partySetQty(pizza.id, 4);
      PZ.partyResetAllQuantities();
      const all = PZ.partyGetAllPizzas();
      const result = PZ.partyComputeAggregatedList();
      renderBox('partyResetAllQuantities() setzt alle Stückzahlen zurück, löscht aber keine Pizzen', [
        { label: 'Weiterhin 9 Pizzen (8 Presets + 1 eigene): nichts gelöscht', ok: all.length === 9, actual: all.length, expected: 9, tol: null },
        { label: 'Margherita-Stückzahl ist jetzt 0', ok: PZ.partyGetQty('preset_margherita') === 0, actual: PZ.partyGetQty('preset_margherita'), expected: 0, tol: null },
        { label: 'Salami-Stückzahl ist jetzt 0', ok: PZ.partyGetQty('preset_salami') === 0, actual: PZ.partyGetQty('preset_salami'), expected: 0, tol: null },
        { label: 'Eigene Pizza-Stückzahl ist jetzt 0', ok: PZ.partyGetQty(pizza.id) === 0, actual: PZ.partyGetQty(pizza.id), expected: 0, tol: null },
        { label: 'Aggregierte Liste ist wieder leer (totalPizzaCount = 0)', ok: result.totalPizzaCount === 0, actual: result.totalPizzaCount, expected: 0, tol: null },
        { label: 'Eigene Pizza "Bleibt erhalten" ist weiterhin in getAllPizzas() vorhanden', ok: all.some(p => p.id === pizza.id && p.name === 'Bleibt erhalten'), actual: all.map(p => p.name), expected: 'enthält "Bleibt erhalten"', tol: null }
      ]);
    });

    // --- Eigener localStorage-Key, komplett getrennt vom Rezepte-Key ---
    (function () {
      const RECIPE_KEY = 'pizzaRechner';
      const recipeBackup = PZ.store.get(RECIPE_KEY);
      withCleanPartyStorage(() => {
        PZ.store.remove(RECIPE_KEY);
        try {
          PZ.partyAddCustomPizza('Isolationstest', [{ name: 'X', amount: 1, unit: 'g' }]);
          const recipeRaw = PZ.store.get(RECIPE_KEY);
          renderBox('Pizza-Party-Daten landen unter einem eigenen localStorage-Key, nicht im Rezepte-Key', [
            { label: '"pizzaPartyPlanner" enthält jetzt Daten', ok: !!PZ.store.get(PARTY_KEY), actual: !!PZ.store.get(PARTY_KEY), expected: true, tol: null },
            { label: '"pizzaRechner" (Rezepte-Key) bleibt unberührt (weiterhin leer)', ok: recipeRaw === null, actual: recipeRaw, expected: null, tol: null }
          ]);
        } finally {
          if (recipeBackup !== null) PZ.store.set(RECIPE_KEY, recipeBackup);
          else PZ.store.remove(RECIPE_KEY);
        }
      });
    })();

    // --- Robustheit: korruptes JSON im Party-localStorage darf nicht crashen ---
    withCleanPartyStorage(() => {
      PZ.store.set(PARTY_KEY, '{ das ist kein gültiges JSON');
      let threw = false;
      let pizzas = [];
      try { pizzas = PZ.partyGetAllPizzas(); } catch (e) { threw = true; }
      renderBox('Korruptes JSON im Party-localStorage: keine Exception, fällt auf die 8 Presets zurück', [
        { label: 'Kein Fehler beim Lesen', ok: !threw, actual: threw, expected: false, tol: null },
        { label: 'Trotzdem die 8 Presets verfügbar', ok: pizzas.length === 8, actual: pizzas.length, expected: 8, tol: null }
      ]);
    });

    // Ursprünglichen Party-Stand (falls vorhanden) wiederherstellen, sonst Testspuren entfernen
    if (backup !== null) PZ.store.set(PARTY_KEY, backup);
    else PZ.store.remove(PARTY_KEY);
  })();

  heading('26 · Einheitensystem-Umschaltung Metrisch/Imperial (js/units.js, v3.65.0)');

  // geprüft (PZ._resolveInitialUnits/formatWeight/formatWeightAuto/formatTemp), plus ein
  // DOM-Effekt-Test für den Umschalter (#unitSwitch-Stub oben) und ein Integrationstest,
  // dass calc() im Imperial-Modus tatsächlich oz/lb/°F ins DOM schreibt. js/calc.js/
  // js/schedule.js selbst wurden NICHT in ihrer Rechenlogik verändert (nur die

  // Bäckerprozente-/Masseerhaltungs-Prüfungen aus Sektion 1 ff., nur das neue Feature.
  (function () {
    const UNITS_KEY = 'pizzaUnits';
    const backup = PZ.store.get(UNITS_KEY);
    const unitsBackup = PZ.getUnitSystem();

      { label: 'stored=null, Region en-US -> "imperial" (Regions-Erkennung greift)', ok: PZ._resolveInitialUnits(null, true) === 'imperial', actual: PZ._resolveInitialUnits(null, true), expected: 'imperial', tol: null },
      { label: 'stored=null, Region nicht-en-US -> "metric" (Regions-Erkennung greift)', ok: PZ._resolveInitialUnits(null, false) === 'metric', actual: PZ._resolveInitialUnits(null, false), expected: 'metric', tol: null },
      { label: 'stored="quatsch" (unbekannter Wert) -> Regions-Erkennung statt Crash', ok: PZ._resolveInitialUnits('quatsch', true) === 'imperial', actual: PZ._resolveInitialUnits('quatsch', true), expected: 'imperial', tol: null }
    ]);

    // --- setUnitSystem()/getUnitSystem(): schaltet um, persistiert in localStorage ---
    (function () {
      PZ.store.remove(UNITS_KEY);
      PZ.setUnitSystem('imperial');
      const afterImperial = PZ.getUnitSystem();
      const storedImperial = PZ.store.get(UNITS_KEY);
      PZ.setUnitSystem('metric');
      const afterMetric = PZ.getUnitSystem();
      const storedMetric = PZ.store.get(UNITS_KEY);
      renderBox('setUnitSystem()/getUnitSystem() schalten um und persistieren in localStorage', [
        { label: 'setUnitSystem("imperial") -> getUnitSystem() liefert "imperial"', ok: afterImperial === 'imperial', actual: afterImperial, expected: 'imperial', tol: null },
        { label: 'setUnitSystem("imperial") persistiert "imperial" in localStorage', ok: storedImperial === 'imperial', actual: storedImperial, expected: 'imperial', tol: null },
        { label: 'setUnitSystem("metric") -> getUnitSystem() liefert "metric"', ok: afterMetric === 'metric', actual: afterMetric, expected: 'metric', tol: null },
        { label: 'setUnitSystem("metric") persistiert "metric" in localStorage', ok: storedMetric === 'metric', actual: storedMetric, expected: 'metric', tol: null }
      ]);
    })();

    // --- setUnitSystem(): ungültiger Wert wird ignoriert (kein Crash, keine Änderung) ---
    (function () {
      PZ.setUnitSystem('metric');
      PZ.setUnitSystem('unzen'); // nicht unterstützt (nur metric/imperial laut Feature-Auftrag)
      renderBox('setUnitSystem() ignoriert nicht unterstützte Werte', [
        { label: 'Einheitensystem bleibt bei "metric"', ok: PZ.getUnitSystem() === 'metric', actual: PZ.getUnitSystem(), expected: 'metric', tol: null }
      ]);

    // --- formatWeight()/formatWeightAuto(): Metrisch reproduziert bestehende Rundung ---
    (function () {
      PZ.setUnitSystem('metric');
      renderBox('formatWeight()/formatWeightAuto() im Metrisch-Modus: 1:1 die bisherigen Rundungskonventionen', [
        { label: 'formatWeight(600) -> "600 g" (0 Nachkommastellen Default)', ok: PZ.formatWeight(600) === '600 g', actual: PZ.formatWeight(600), expected: '600 g', tol: null },

        { label: 'formatWeightAuto(16.8) -> "17 g" (>= 10 g -> ganzzahlig gerundet, kein Trennzeichen)', ok: PZ.formatWeightAuto(16.8) === '17 g', actual: PZ.formatWeightAuto(16.8), expected: '17 g', tol: null }
      ]);
    })();

    // --- formatWeight(): Imperial-Modus, 0,1-oz-Rundung + "X lb Y oz"-Umbruch ab 16 oz ---
    (function () {

      renderBox('formatWeight() im Imperial-Modus: 0,1-oz-Rundung (Komma statt Punkt, v4.30.1-Fix), ab 16 oz "X lb Y oz"', [

        { label: 'formatWeight(0) -> "0,0 oz" (kein NaN/negativer Wert)', ok: PZ.formatWeight(0) === '0,0 oz', actual: PZ.formatWeight(0), expected: '0,0 oz', tol: null },

      ]);
      PZ.setUnitSystem('metric');

    // --- formatTemp(): Metrisch hängt nur die Einheit an, Imperial rundet auf ganze °F ---
    (function () {
      PZ.setUnitSystem('metric');
      const metric195 = PZ.formatTemp(19.5);
      const metric21 = PZ.formatTemp(21);
      PZ.setUnitSystem('imperial');
      const imp195 = PZ.formatTemp(19.5);

        { label: 'Metrisch: formatTemp(19.5) -> "19,5°C" (keine erneute Rundung, Komma statt Punkt)', ok: metric195 === '19,5°C', actual: metric195, expected: '19,5°C', tol: null },

    // auf Komma, anders als die etablierte App-Konvention (js/widgets.js/js/party.js,
    // s. Bugfix v3.32.0 dort). Betroffen: formatWeightAuto() < 10 g (v. a. Hefe-Anzeige),
    // formatWeight() mit metricDecimals > 0 (Salz/Öl/Zucker) und formatOzNumber() im
    // Imperial-Modus. Gezielte Prüfung genau der zuvor gemeldeten Fälle. ---
    (function () {
      PZ.setUnitSystem('metric');
      const yeastSmall = PZ.formatWeightAuto(1.23);
      const saltOneDecimal = PZ.formatWeight(12.5, 1);
      PZ.setUnitSystem('imperial');
      const ozImperial = PZ._formatImperialWeight(600.5);

        { label: 'formatWeightAuto(1.23) -> "1,23 g" (Hefe-Anzeige < 10 g, kein Punkt)', ok: yeastSmall === '1,23 g' && yeastSmall.indexOf('.') === -1, actual: yeastSmall, expected: '1,23 g', tol: null },
        { label: 'formatWeight(12.5, 1) -> "12,5 g" (Salz/Öl/Zucker-Formatierung, kein Punkt)', ok: saltOneDecimal === '12,5 g' && saltOneDecimal.indexOf('.') === -1, actual: saltOneDecimal, expected: '12,5 g', tol: null },
        { label: 'Imperial-Ausgabe enthält keinen Punkt mehr (nur Komma als Dezimaltrennzeichen)', ok: ozImperial.indexOf('.') === -1, actual: ozImperial, expected: 'kein "." enthalten', tol: null }

    // --- Integrationstest: PZ.calc() schreibt im Imperial-Modus oz/lb/°F ins DOM,

    (function () {

      PZ.setUnitSystem('imperial');
      PZ.calc();
      const flourImperial = PZ.R.flour;
      const totalWImperialText = document.getElementById('totalW').textContent;
      const gFlourImperialText = document.getElementById('gFlour').textContent;
      PZ.setUnitSystem('metric');
      PZ.calc();
      // Hinweis: #waterTemp (bisher hier mitgeprüft) gibt es seit v4.16.0 nicht mehr im DOM
      // (Schüttwasser-Anzeige entfernt) -- die °F-Formatierung selbst bleibt über den
      // direkten PZ.formatTemp()-Test weiter oben in dieser Sektion abgedeckt.
      renderBox('PZ.calc() im Imperial-Modus: DOM zeigt oz/lb, Rechenkern (PZ.R, Gramm/Celsius) unverändert', [
        { label: 'Metrisch: #totalW enthält "g"', ok: totalWMetricText.indexOf(' g') !== -1, actual: totalWMetricText, expected: 'enthält " g"', tol: null },
        { label: 'Imperial: #totalW enthält "oz" oder "lb" (nicht mehr " g")', ok: /oz|lb/.test(totalWImperialText) && totalWImperialText.indexOf(' g') === -1, actual: totalWImperialText, expected: 'enthält "oz"/"lb", kein " g"', tol: null },

        { label: 'Rechenkern unverändert: PZ.R.flour identisch in Metrisch und Imperial (nur Anzeige ändert sich)', ok: Math.abs(flourMetric - flourImperial) < 0.001, actual: flourImperial, expected: flourMetric, tol: 0.001 }
      ]);
    })();

    // --- DOM-Effekt: setUnitSystem() spiegelt den Zustand im #unitSwitch-Stub (aria-pressed/
    // .active), analog zum #themeSwitch-Test in Sektion 24 (identisches Timing-Argument:
    // Click-Verdrahtung + Live-Region-Ansage #unitsAnnounce bleiben entsprechend ungetestet). ---
    (function () {
      const metricBtn = document.querySelector('#unitSwitch button[data-units-choice="metric"]');
      const imperialBtn = document.querySelector('#unitSwitch button[data-units-choice="imperial"]');
      PZ.setUnitSystem('imperial');

      const metricInactive = !metricBtn.classList.contains('active') && metricBtn.getAttribute('aria-pressed') === 'false';

        { label: 'setUnitSystem("imperial") -> "Metrisch"-Button wird inaktiv', ok: metricInactive, actual: metricInactive, expected: true, tol: null },

        { label: 'setUnitSystem("metric") -> "Imperial"-Button wird wieder inaktiv', ok: imperialInactive, actual: imperialInactive, expected: true, tol: null }

  (function () {

    // unten in dieser Datei).

    PZ.toggleCollapse(tcContainer, true, { announceId: 'tcLiveMsg', announceText: 'Testansage' });
    const classAdded = tcContainer.classList.contains('show');

    const classRemovedWithoutOpts = !tcContainer.classList.contains('show');

  heading('33 · Label-Kopplung: Optionslabel-Gärzeit vs. tatsächlich berechnete Gesamtdauer (v4.25.1)');
  // Derselbe Fehler ("Label nennt eine Zahl, die App-Rechnung eine andere") trat in drei
  // aufeinanderfolgenden Zyklen unabhängig auf: Poolish (v4.24.0), Biga (v4.25.0), die
  // übrigen fünf Presets (napoli_klassisch/napoli_kalt/schnell/teglia/newyork_style,
  // v4.25.1) -- jedes Mal, weil nichts das sichtbare Options-Label gegen die echte
  // Berechnung hielt. Dieser Block schließt die Lücke: PRESET_LABEL_HOURS spiegelt die in
  // js/i18n-dict.js sichtbaren "option.*"-Kurzlabels 1:1 wider (einzelner Stundenwert für
  // ein "~X h"-Label, ODER [min, max] für eine Spanne wie "4–6 h"). Bei jeder künftigen
  // Preset- ODER Label-Änderung HIER mitziehen -- analog zum bereits etablierten Muster
  // von PRESET_STATES weiter oben (Sektion 6/13). Bewusst KEINE Laufzeit-Kopplung an den
  // echten i18n-Text (z. B. per Regex aus dem Label geparst): das wäre eine invasive
  // dynamische Label-Erzeugung, die für diesen Patch explizit nicht gewollt war.
  const PRESET_LABEL_HOURS = {
    'napoli_klassisch': 28,            // option.napoliKlassisch "Napoli Klassisch · ~28 h"
    'napoli_kalt': 44,                 // option.napoliKalt "Napoli Lange Kaltgare · ~44 h" (v4.30.0)
    'schnell': [4, 6],                 // option.schnell "Schnell · 4–6 h" (Spanne, kein Einzelwert)
    'napoli_biga_klassisch': 29,       // option.napoliBigaKlassisch "… · ~29 h"
    'napoli_biga_kalt': 60,            // option.napoliBigaKalt "… · ~60 h"
    'napoli_poolish_schnell': 20,      // option.napoliPoolishSchnell "… · ~20 h"
    'napoli_poolish_kalt': 34,         // option.napoliPoolishKalt "… · ~34 h"
    'teglia': 76,                      // option.teglia "Teglia / Blech · ~76 h" (v4.28.0)
    'newyork_style': 44                // option.newyorkStyle "New York Style · ~44 h" (v4.28.0)
  };
  const LABEL_TOL_PCT = 0.10; // ±10 % (s. Auftrag) -- alle neun Presets liegen real < 2 % daneben

  Object.keys(PRESET_LABEL_HOURS).forEach(key => {
    testCase('Preset „' + key + '": Label-Gärzeit passt zur tatsächlich berechneten Gesamtdauer (R.totalMin)', PRESET_STATES[key], R => {
      const realH = R.totalMin / 60;
      const spec = PRESET_LABEL_HOURS[key];
      if (Array.isArray(spec)) {
        const [lo, hi] = spec;
        return [
          ['reale Dauer ' + realH.toFixed(2) + ' h liegt innerhalb der Label-Spanne [' + lo + ', ' + hi + '] h', (realH >= lo && realH <= hi), true],
        ];
      }
      return [
        ['reale Dauer (h) liegt binnen ±10 % am Label "~' + spec + ' h"', realH, spec, spec * LABEL_TOL_PCT],
      ];
    });
  });

  // --- Text-Zahlen-Konsistenz (js/guide.js): das gerenderte #guideSteps-HTML muss die
  //     tatsächlich skalierte Zeit zeigen, nicht die statische Ursprungsspanne. ---
  // fmtDur-Nachbau (aus js/guide.js, analog zu fmtClockTest oben): nur zum Prüfen des
  // gerenderten Anleitungstexts, dupliziert keine Rechenlogik.
  function fmtDurTest(min) {
    min = Math.round(min);
    if (min < 60) return min + ' ' + PZ.t('guide.dur.min');
    const h = Math.round(min / 60);
    if (h < 24) return h + ' ' + PZ.t('guide.dur.h');
    const d = Math.floor(h / 24), r = h % 24;
    return d + ' ' + PZ.t('guide.dur.day') + (r ? ' ' + r + ' ' + PZ.t('guide.dur.h') : '');
  }

  heading('37 · Regressionsschutz v4.29.1: HTML-`max`-Attribut von #ballwN/#nrBallwN vs. höchster Preset-ballw');
  // Bug-Hergang (v4.29.0 → v4.29.1): js/presets.js setzte teglia.ballw = 600, aber
  // #ballwN/#nrBallwN hatten in allen drei HTML-Dateien noch max="500" (Altlast aus der
  // Zeit vor der Blechflächendosierung). js/widgets.js (stepper()/link(), clampTo())
  // liest n.max direkt vom HTML-Attribut und kappt jeden per PZ.set.ballw(...) gesetzten
  // Wert lautlos darauf -- PZ.state.ballw landete real bei 500 statt 600, ohne
  // Fehlermeldung. Live per Headless-Edge-Verifikation gefunden (nicht durch diese
  // Suite), weil KEINER der bisherigen 1106 Tests den HTML-Clamp-Pfad überhaupt
  // durchläuft: s. u.
  //
  // Warum das kein automatischer, vollwertiger Test wird (Architektur-Grenze dieser
  // Suite, bewusste Abwägung statt Auslassung):
  // 1) tests/test.html lädt weder js/presets.js noch js/ui.js (s. PZ.set-Stub-Kommentar
  //    weiter oben) und hat kein echtes #ballwN-<input> im Stub-Markup (nur ein Stub-
  //    #preset) -- der reale Clamp-Pfad (stepper()/link() aus js/widgets.js gegen ein
  //    tatsächliches DOM-Element mit min/max-Attributen) wird hier folglich nirgends
  //    ausgeführt. Ihn vollständig nachzubauen (echtes #ballwN + js/ui.js + js/presets.js
  //    im Stub) wäre ein deutlich größerer Umbau der Test-Architektur, als für einen
  //    Bugfix dieses Umfangs gerechtfertigt.
  // 2) Die naheliegende Alternative -- die drei ausgelieferten HTML-Dateien per
  //    fetch()/XHR als Text laden und das max-Attribut herausparsen -- wurde geprüft und
  //    verworfen: eine synchrone XHR-Anfrage von einer file://-Seite auf eine
  //    benachbarte file://-Datei schlägt in Chromium/Edge zuverlässig fehl
  //    ("Failed to load ... Cross origin requests are only supported for HTTP"), per
  //    Headless-Edge-Dump empirisch bestätigt. Die App läuft laut Konzept aber
  //    ausdrücklich PER DOPPELKLICK OHNE SERVER (s. Kopf dieser Datei) -- ein
  //    fetch-basierter Test würde für den normalen Nutzungsweg also selbst fehlschlagen,
  //    nicht nur das eigentliche Feature testen.
  // Stattdessen: ein einfacher Trip-Wire-Regressionstest. HTML_MAX_BALLW unten muss von
  // Hand mit dem tatsächlichen max-Attribut in den drei HTML-Dateien in Sync gehalten
  // werden (aktuell 1000, s. v4.29.1) -- schlägt aber sofort fehl, sobald ein künftiges
  // Preset einen ballw-Wert nahe oder über diesem Wert bekommt, und erinnert so aktiv
  // daran, auch die sechs HTML-max-Attribute (#ballwN + #nrBallwN je Datei) anzuheben,

  // Mini-Helfer: ersetzt window.setTimeout/clearTimeout durch eine synchrone Warteschlange,
  // damit die 1,5-s-Entprellung in js/guide.js UND der 50-ms-Clear-then-Set von
  // PZ.announce() (js/dom.js) ohne echtes Warten getestet werden können. fn(flush)
  // bekommt eine flush()-Funktion, die alle bis dahin geplanten (und währenddessen NEU
  // geplanten, z. B. der innere PZ.announce()-Timer) Callbacks der Reihe nach ausführt --
  // funktional dasselbe Ergebnis wie ein echter Browser über die Zeit liefern würde, nur
  // ohne die Wartezeit. window.setTimeout/clearTimeout (nicht nur eine lokale Kopie),
  // weil js/guide.js und js/dom.js beide über ihr IIFE-Argument "global" (= window beim
  // jeweiligen Laden übergeben) zur AUFRUFZEIT auf die aktuelle Eigenschaft zugreifen --
  // eine Neuzuweisung auf window wirkt sich also unmittelbar aus.
  function withMockTimers(fn) {
    const realSetTimeout = window.setTimeout, realClearTimeout = window.clearTimeout;
    let queue = [], nextId = 1;
    window.setTimeout = function (cb) {
      const id = nextId++;
      queue.push({ id: id, cb: cb });
      return id;
    };
    window.clearTimeout = function (id) {
      queue = queue.filter(function (item) { return item.id !== id; });
    };
    function flush() {
      let guard = 0;
      while (queue.length && guard++ < 50) {
        const item = queue.shift();
        item.cb();
      }
    }
    try { fn(flush); } finally {
      window.setTimeout = realSetTimeout;
      window.clearTimeout = realClearTimeout;
    }
  }

  heading('43 · Speicher-Zwischenschicht (js/store.js, Play-Store-Vorbereitung A2)');

  // Alle vier hier genutzten Schlüssel gehören Modulen, die tests/test.html bewusst NICHT
  // lädt (js/simplemode.js, js/onboarding.js, js/timer.js — s. Dateistruktur-Abschnitt in
  // pizza-rechner-KONTEXT.md) und werden sonst nirgends in dieser Testsuite gelesen/
  // geschrieben — unabhängige Spielwiese, keine Kollision mit anderen Testfällen.
  await (async function () {
    const K_HYDRATE = PZ.store.KEYS.TIMER_HINT_SHOWN;
    const K_SET = PZ.store.KEYS.SIMPLE_MODE;

    // --- hydrate() befüllt den Zwischenspeicher aus dem Hintergrund -------------------
    (function () {
      // Schreibt direkt am Zwischenspeicher vorbei in den echten Hintergrund (identisch
      // dazu, wie ein anderer Tab oder ein künftiger nativer Speicher den Wert ändern
      // könnte) und prüft, dass PZ.store.get() das NICHT sofort sieht (liest nur noch aus
      // dem Zwischenspeicher, kein Live-Durchgriff), bis hydrate() explizit neu befüllt.
      localStorage.removeItem(K_HYDRATE);
      const beforeHydrate = PZ.store.get(K_HYDRATE);
      localStorage.setItem(K_HYDRATE, 'hydrate-marker-a2');
      const stillStale = PZ.store.get(K_HYDRATE);
      renderBox('hydrate() ist nötig, get() liest NICHT live aus dem Hintergrund durch', [
        { label: 'get() vor der externen Änderung: kein Wert im Zwischenspeicher', actual: beforeHydrate, expected: null, tol: null, ok: beforeHydrate === null },
        { label: 'get() sieht die externe Hintergrund-Änderung noch NICHT (Zwischenspeicher ist veraltet)', actual: stillStale, expected: '≠ hydrate-marker-a2', tol: null, ok: stillStale !== 'hydrate-marker-a2' }
      ]);
    })();

    const hydrateResult = PZ.store.hydrate();
    renderBox('PZ.store.hydrate() gibt ein Promise zurück', [
      { label: 'hydrate() liefert ein Promise', actual: hydrateResult instanceof Promise, expected: true, tol: null, ok: hydrateResult instanceof Promise }
    ]);
    await hydrateResult;

    (function () {
      const afterHydrate = PZ.store.get(K_HYDRATE);
      renderBox('Nach await hydrate(): Zwischenspeicher ist aus dem Hintergrund befüllt, get() liefert ohne await/Promise', [
        { label: 'get() liefert jetzt den extern gesetzten Wert', actual: afterHydrate, expected: 'hydrate-marker-a2', tol: null, ok: afterHydrate === 'hydrate-marker-a2' },
        { label: 'get()-Rückgabewert ist kein Promise (echtes, sofortiges Ergebnis)', actual: afterHydrate && typeof afterHydrate.then === 'function', expected: false, tol: null, ok: !(afterHydrate && typeof afterHydrate.then === 'function') }
      ]);
      localStorage.removeItem(K_HYDRATE);
    })();
    await PZ.store.hydrate(); // Zwischenspeicher wieder aufräumen (K_HYDRATE zurück auf null)

    // --- set() ist im direkt folgenden get() sofort sichtbar, ohne auf den Hintergrund zu
    //     warten (fire-and-forget) -------------------------------------------------------
    // In diesem Punkt A2 ist `_backend` (localStorage) noch synchron, ein set() landet also
    // im selben Durchlauf auch schon im echten Hintergrund (bewusste Design-Entscheidung,
    // s. Kommentar bei set() in js/store.js -- hält bestehenden Code, der Zwischenspeicher
    // UND Hintergrund im selben synchronen Durchlauf konsistent erwartet, unverändert
    // lauffähig). Um die eigentliche fire-and-forget-Eigenschaft (sichtbar im get(), AUCH
    // wenn der Hintergrund noch nicht fertig ist) unabhängig vom heutigen synchronen
    // Backend zu prüfen, wird `_backend.set` hier kurz durch einen künstlich verzögerten
    // Stub ersetzt (simuliert den künftigen asynchronen nativen Speicher aus B3).
    localStorage.removeItem(K_SET);
    const realBackendSet = PZ.store._backend.set;
    let backendWriteDone = false;
    PZ.store._backend.set = function (key, value) {
      return new Promise((resolve) => {
        setTimeout(() => { backendWriteDone = true; resolve(realBackendSet(key, value)); }, 30);
      });
    };
    try {
      const setReturn = PZ.store.set(K_SET, 'set-sync-test-a2');
      const immediateGet = PZ.store.get(K_SET);
      renderBox('set() schreibt sofort synchron in den Zwischenspeicher (fire-and-forget zum Hintergrund)', [
        { label: 'set() gibt true zurück', actual: setReturn, expected: true, tol: null, ok: setReturn === true },
        { label: 'get() sieht den neuen Wert im selben synchronen Durchlauf', actual: immediateGet, expected: 'set-sync-test-a2', tol: null, ok: immediateGet === 'set-sync-test-a2' },
        { label: 'der (hier künstlich verzögerte) Hintergrund ist in diesem Moment noch NICHT durch', actual: backendWriteDone, expected: false, tol: null, ok: backendWriteDone === false }
      ]);

      // --- flush() erfüllt sich als Promise, sobald der angestoßene Schreibvorgang durch ist
      const flushResult = PZ.store.flush();
      renderBox('PZ.store.flush() gibt ein Promise zurück', [
        { label: 'flush() liefert ein Promise', actual: flushResult instanceof Promise, expected: true, tol: null, ok: flushResult instanceof Promise }
      ]);
      await flushResult;
      renderBox('Nach await flush(): der angestoßene Hintergrund-Schreibvorgang aus set() ist durch', [
        { label: 'der (künstlich verzögerte) Hintergrund-Schreibvorgang ist abgeschlossen', actual: backendWriteDone, expected: true, tol: null, ok: backendWriteDone === true },
        { label: 'der echte Hintergrund (localStorage) hat jetzt den Wert', actual: localStorage.getItem(K_SET), expected: 'set-sync-test-a2', tol: null, ok: localStorage.getItem(K_SET) === 'set-sync-test-a2' }
      ]);
    } finally {
      PZ.store._backend.set = realBackendSet;
    }
    localStorage.removeItem(K_SET);
    await PZ.store.hydrate(); // Zwischenspeicher wieder aufräumen (K_SET zurück auf null)

    // --- PZ.store._backend: der Hintergrund-Adapter mit get/set/remove, bleibt in diesem
    //     Punkt A2 localStorage (Tausch auf nativen Speicher erst B3) -------------------
    renderBox('PZ.store._backend ist der Hintergrund-Adapter mit get/set/remove', [
      { label: '_backend.get ist eine Funktion', actual: typeof PZ.store._backend.get, expected: 'function', tol: null, ok: typeof PZ.store._backend.get === 'function' },
      { label: '_backend.set ist eine Funktion', actual: typeof PZ.store._backend.set, expected: 'function', tol: null, ok: typeof PZ.store._backend.set === 'function' },
      { label: '_backend.remove ist eine Funktion', actual: typeof PZ.store._backend.remove, expected: 'function', tol: null, ok: typeof PZ.store._backend.remove === 'function' }
    ]);

    // --- Ergänzende Randfälle (test-generator-Durchlauf, s. pizza-rechner-KONTEXT.md) ---
    const K_JSON = PZ.store.KEYS.ONBOARDING_DONT_SHOW; // Modul nicht geladen, s. Kommentar oben
    PZ.store.remove(K_JSON);
    await PZ.store.hydrate();

    // 1) getJSON() auf fehlenden Schlüssel: Standard-Fallback (null) und eigener Fallback
    renderBox('getJSON() auf fehlenden Schlüssel liefert den Fallback (Standard null, oder eigenen)', [
      { label: 'ohne Fallback-Argument: null', actual: PZ.store.getJSON(K_JSON), expected: null, tol: null, ok: PZ.store.getJSON(K_JSON) === null },
      { label: 'mit eigenem Fallback-Objekt: genau dieses Objekt', actual: PZ.store.getJSON(K_JSON, { x: 1 }), expected: '{x:1}', tol: null, ok: (function () { const f = PZ.store.getJSON(K_JSON, { x: 1 }); return f && f.x === 1; })() }
    ]);

    // 2) getJSON() auf kaputtes JSON: Fallback statt Crash
    PZ.store.set(K_JSON, '{ das ist kein gültiges JSON');
    renderBox('getJSON() auf kaputtes JSON liefert den Fallback, kein Crash', [
      { label: 'ohne Fallback-Argument: null', actual: PZ.store.getJSON(K_JSON), expected: null, tol: null, ok: PZ.store.getJSON(K_JSON) === null },
      { label: 'mit eigenem Fallback: \'FALLBACK\'', actual: PZ.store.getJSON(K_JSON, 'FALLBACK'), expected: 'FALLBACK', tol: null, ok: PZ.store.getJSON(K_JSON, 'FALLBACK') === 'FALLBACK' }
    ]);

    // 3) setJSON()/getJSON()-Rundtrip mit verschachteltem Objekt, sofort synchron lesbar
    const nested = { a: 1, b: { c: [1, 2, 3], d: 'text' } };
    const setJsonReturn = PZ.store.setJSON(K_JSON, nested);
    const readBack = PZ.store.getJSON(K_JSON);
    renderBox('setJSON()/getJSON()-Rundtrip mit verschachteltem Objekt, im selben Durchlauf lesbar', [
      { label: 'setJSON() gibt true zurück', actual: setJsonReturn, expected: true, tol: null, ok: setJsonReturn === true },
      { label: 'getJSON() liefert 1:1 dasselbe Objekt (JSON-Vergleich)', actual: JSON.stringify(readBack), expected: JSON.stringify(nested), tol: null, ok: JSON.stringify(readBack) === JSON.stringify(nested) }
    ]);

    // 4) setJSON(key, null): JSON.stringify(null) === "null" (String) -- unterscheidet sich
    //    von einem fehlenden Schlüssel (get() === null), obwohl getJSON() in beiden Fällen
    //    null liefert (einmal weil geparst "null" tatsächlich null ergibt, einmal als Fallback).
    PZ.store.setJSON(K_JSON, null);
    renderBox('setJSON(key, null): wird als String "null" gespeichert, nicht mit einem fehlenden Schlüssel verwechselt', [
      { label: 'get() liefert den String "null" (Schlüssel ist gesetzt, nicht leer)', actual: PZ.store.get(K_JSON), expected: 'null', tol: null, ok: PZ.store.get(K_JSON) === 'null' },
      { label: 'getJSON() mit eigenem Fallback liefert trotzdem null (echter geparster Wert, NICHT der Fallback)', actual: PZ.store.getJSON(K_JSON, 'SENTINEL'), expected: null, tol: null, ok: PZ.store.getJSON(K_JSON, 'SENTINEL') === null }
    ]);
    PZ.store.remove(K_JSON);
    await PZ.store.hydrate();

    // 5) remove() auf einen zuvor gesetzten Schlüssel: cache sofort null, nach flush() auch
    //    der echte Hintergrund geleert
    PZ.store.set(K_SET, 'wird-gleich-entfernt');
    await PZ.store.flush();
    const removeReturn = PZ.store.remove(K_SET);
    const cacheAfterRemove = PZ.store.get(K_SET);
    await PZ.store.flush();
    renderBox('remove() auf einen zuvor gesetzten Schlüssel: cache sofort null, Hintergrund nach flush() ebenfalls geleert', [
      { label: 'remove() gibt true zurück', actual: removeReturn, expected: true, tol: null, ok: removeReturn === true },
      { label: 'get() liefert sofort null', actual: cacheAfterRemove, expected: null, tol: null, ok: cacheAfterRemove === null },
      { label: 'echter Hintergrund (localStorage) ist nach flush() ebenfalls geleert', actual: localStorage.getItem(K_SET), expected: null, tol: null, ok: localStorage.getItem(K_SET) === null }
    ]);

    // 6) remove() auf einen nie gesetzten Schlüssel: kein Crash, bleibt null
    let removeNeverSetThrew = false;
    let removeNeverSetReturn = null;
    try { removeNeverSetReturn = PZ.store.remove(K_JSON); } catch (e) { removeNeverSetThrew = true; }
    renderBox('remove() auf einen nie gesetzten Schlüssel: kein Crash, get() bleibt null', [
      { label: 'kein Fehler', actual: removeNeverSetThrew, expected: false, tol: null, ok: removeNeverSetThrew === false },
      { label: 'remove() gibt trotzdem true zurück', actual: removeNeverSetReturn, expected: true, tol: null, ok: removeNeverSetReturn === true },
      { label: 'get() bleibt null', actual: PZ.store.get(K_JSON), expected: null, tol: null, ok: PZ.store.get(K_JSON) === null }
    ]);

    // 7) mehrere schnelle set()-Aufrufe auf denselben Schlüssel hintereinander: letzter
    //    Wert gewinnt, sowohl im cache als auch (nach flush) im echten Hintergrund
    PZ.store.set(K_SET, 'erst-a');
    PZ.store.set(K_SET, 'dann-b');
    PZ.store.set(K_SET, 'zuletzt-c');
    const lastWriteWinsCache = PZ.store.get(K_SET);
    await PZ.store.flush();
    renderBox('mehrere schnelle set()-Aufrufe auf denselben Schlüssel: letzter Wert gewinnt (cache UND Hintergrund)', [
      { label: 'get() liefert sofort den letzten Wert', actual: lastWriteWinsCache, expected: 'zuletzt-c', tol: null, ok: lastWriteWinsCache === 'zuletzt-c' },
      { label: 'echter Hintergrund hat nach flush() ebenfalls den letzten Wert', actual: localStorage.getItem(K_SET), expected: 'zuletzt-c', tol: null, ok: localStorage.getItem(K_SET) === 'zuletzt-c' }
    ]);
    PZ.store.remove(K_SET);
    await PZ.store.hydrate();

    // 8) flush() ohne vorherige set()-Aufrufe (keine angestoßenen Schreibvorgänge): löst
    //    sich trotzdem als Promise auf, hängt nicht
    const emptyFlushResult = PZ.store.flush();
    renderBox('flush() ohne vorherige set()-Aufrufe löst sich sofort auf', [
      { label: 'flush() liefert ein Promise', actual: emptyFlushResult instanceof Promise, expected: true, tol: null, ok: emptyFlushResult instanceof Promise }
    ]);
    await emptyFlushResult;
    renderBox('...und das Promise ist tatsächlich durch (kein Hängenbleiben)', [
      { label: 'await ist zurückgekehrt', actual: true, expected: true, tol: null, ok: true }
    ]);

    // 9) get() auf einen Schlüssel außerhalb der 11 bekannten PZ.store.KEYS: kein Crash,
    //    liefert null (hydrate() befüllt nur die 11 bekannten Schlüssel, s. ALL_KEYS in
    //    js/store.js -- ein unbekannter Schlüssel landet nie im cache)
    let unknownKeyThrew = false;
    let unknownKeyResult = 'not-null-sentinel';
    try { unknownKeyResult = PZ.store.get('einSchluesselDerNirgendsInKEYSVorkommt'); } catch (e) { unknownKeyThrew = true; }
    renderBox('get() auf einen Schlüssel außerhalb von PZ.store.KEYS: kein Crash, liefert null', [
      { label: 'kein Fehler', actual: unknownKeyThrew, expected: false, tol: null, ok: unknownKeyThrew === false },
      { label: 'liefert null (nicht undefined)', actual: unknownKeyResult, expected: null, tol: null, ok: unknownKeyResult === null }
    ]);

    // 10) hydrate() während ein set() noch im (künstlich verzögerten) Hintergrund läuft:
    //     ANDERS als man naiv erwarten könnte, "gewinnt" hier NICHT automatisch der
    //     optimistische set()-Wert -- hydrate() liest beim Aufruf einmal alle 11 bekannten
    //     Schlüssel direkt aus dem echten Hintergrund (Microtask, läuft VOR dem verzögerten
    //     _backend.set-Stub, der über setTimeout als Makrotask erst später feuert) und
    //     überschreibt den cache dabei mit dem zu diesem Zeitpunkt noch ALTEN Hintergrund-
    //     Wert. Bewusst als Randfall dokumentiert statt stillschweigend als "unproblematisch"
    //     angenommen (Vorschlag des test-generator-Agenten ging von einer stets konsistenten
    //     Koexistenz aus -- das trifft laut eigener Nachrechnung der Promise-Microtask-vs-
    //     Makrotask-Reihenfolge NICHT zu). Betrifft die reale App nicht: hydrate() wird
    //     aktuell nirgends aufgerufen (das kommt erst in B2), dieser Test hält die
    //     tatsächliche Implementierung fest, keine Verhaltensänderung an js/store.js nötig.
    localStorage.removeItem(K_SET);
    await PZ.store.hydrate();
    const realBackendSet2 = PZ.store._backend.set;
    PZ.store._backend.set = function (key, value) {
      return new Promise((resolve) => { setTimeout(() => resolve(realBackendSet2(key, value)), 30); });
    };
    try {
      PZ.store.set(K_SET, 'race-value');
      await PZ.store.hydrate(); // läuft VOR dem verzögerten Hintergrund-Schreiben durch
      const cacheAfterRaceHydrate = PZ.store.get(K_SET);
      renderBox('hydrate() während eines noch laufenden set()-Hintergrund-Schreibvorgangs: dokumentiertes Verhalten', [
        { label: 'cache wird von hydrate() mit dem (noch alten) Hintergrund-Stand überschrieben, NICHT mit dem optimistischen set()-Wert', actual: cacheAfterRaceHydrate, expected: null, tol: null, ok: cacheAfterRaceHydrate === null }
      ]);
      await PZ.store.flush(); // wartet den verzögerten Schreibvorgang ab, bevor der Stub zurückgesetzt wird
    } finally {
      PZ.store._backend.set = realBackendSet2;
    }
    localStorage.removeItem(K_SET);
    await PZ.store.hydrate();

    // 11) set(key, null): wird als tatsächlicher null-Wert im cache gehalten (nicht als
    //     fehlender/undefined-Schlüssel), get() liefert also explizit null zurück -- deckt
    //     sich mit dem bisherigen get()-Vertrag ("fehlender Schlüssel -> null"), ist hier
    //     aber bewusst über set() explizit herbeigeführt statt nur der Default-Zustand.
    const setNullReturn = PZ.store.set(K_SET, null);
    renderBox('set(key, null) wird korrekt gespeichert (kein Crash, kein undefined)', [
      { label: 'set() gibt true zurück', actual: setNullReturn, expected: true, tol: null, ok: setNullReturn === true },
      { label: 'get() liefert null', actual: PZ.store.get(K_SET), expected: null, tol: null, ok: PZ.store.get(K_SET) === null }
    ]);
    PZ.store.remove(K_SET);
    await PZ.store.hydrate();

    // 12) PZ.store.KEYS: alle 11 Schlüssel vorhanden, alle nicht-leere Strings
    const expectedKeyNames = ['RECIPES', 'PARTY', 'FEATURE_FLAGS', 'ADJUSTMENTS', 'LANG', 'THEME', 'UNITS', 'SIMPLE_MODE', 'ONBOARDING_DONT_SHOW', 'TIMERS', 'TIMER_HINT_SHOWN'];
    renderBox('PZ.store.KEYS enthält alle 11 bekannten Schlüssel, alle nicht-leere Strings', [
      { label: 'genau 11 Einträge', actual: Object.keys(PZ.store.KEYS).length, expected: 11, tol: null, ok: Object.keys(PZ.store.KEYS).length === 11 },
      { label: 'alle 11 erwarteten Namen vorhanden', actual: expectedKeyNames.filter((k) => !(k in PZ.store.KEYS)).join(',') || '(keine fehlen)', expected: '(keine fehlen)', tol: null, ok: expectedKeyNames.every((k) => k in PZ.store.KEYS) },
      { label: 'alle Werte sind nicht-leere Strings', actual: Object.values(PZ.store.KEYS).every((v) => typeof v === 'string' && v.length > 0), expected: true, tol: null, ok: Object.values(PZ.store.KEYS).every((v) => typeof v === 'string' && v.length > 0) }
    ]);
  })();

  heading('44 · Vollständige Sicherung (js/backup.js, Play-Store-Vorbereitung A3)');

  await (async function () {
    const ALL_KEYS = Object.keys(PZ.store.KEYS).map((k) => PZ.store.KEYS[k]);

    // Alle 11 heutigen Rohwerte sichern, damit dieser Testblock am Ende exakt den
    // ursprünglichen Zustand wiederherstellen kann -- unabhängig davon, ob ein Schlüssel
    // vorher gesetzt war oder nicht (dann liefert PZ.store.get() null).
    const originalValues = {};
    ALL_KEYS.forEach((key) => { originalValues[key] = PZ.store.get(key); });

    try {
      // --- exportFullBackup(): Grundform --------------------------------------------
      (function () {
        const out = PZ.exportFullBackup();
        renderBox('exportFullBackup() liefert die erwartete Grundform', [
          { label: 'format-Feld gesetzt', actual: out.format, expected: 'pizzaRechnerFullBackup', tol: null, ok: out.format === 'pizzaRechnerFullBackup' },
          { label: 'version-Feld gesetzt', actual: out.version, expected: 1, tol: null, ok: out.version === 1 },
          { label: 'exportedAt ist ein gültiger ISO-Zeitstempel', actual: !isNaN(Date.parse(out.exportedAt)), expected: true, tol: null, ok: !isNaN(Date.parse(out.exportedAt)) },
          { label: 'data ist ein Objekt (kein Array)', actual: !!(out.data && typeof out.data === 'object' && !Array.isArray(out.data)), expected: true, tol: null, ok: !!(out.data && typeof out.data === 'object' && !Array.isArray(out.data)) },
          { label: 'pzPresetSwipeHint (sessionStorage, bewusst nicht Teil der Zwischenschicht) ist NIE in data enthalten', actual: 'pzPresetSwipeHint' in out.data, expected: false, tol: null, ok: !('pzPresetSwipeHint' in out.data) }
        ]);
      })();

      // --- Voller Roundtrip über alle 11 Schlüssel: setzen -> exportieren -> Datei-
      //     Roundtrip (JSON.stringify/parse) -> ALLE 11 Schlüssel löschen (simuliert das
      //     Abnahmekriterium "App-Daten vollständig löschen") -> einlesen -> alle 11
